[project]
name = "team-skills-matrix"
version = "0.1.0"
description = "Team Skills Matrix Platform built with Python, NiceGUI, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skills-matrix = "skills_matrix.main:run"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
